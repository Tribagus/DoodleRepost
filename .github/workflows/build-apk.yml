
name: Build DoodleRepost APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          unzip DoodleRepost_Android_Native_Source_MobileBuild.zip -d /tmp/source
          cp -R /tmp/source/DoodleRepostAndroid/. .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoodleRepost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
